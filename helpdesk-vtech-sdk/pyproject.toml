[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk-vtech-sdk"
version = "0.1.0"
description = "Async Python SDK for Virtual Technician agents connecting to the Helpdesk / ITSM platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Helpdesk / ITSM Platform" }]
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/your-org/helpdesk-itsm"

[tool.setuptools.packages.find]
include = ["helpdesk_vtech_sdk*"]
